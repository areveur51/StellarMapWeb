<!-- radialTidyTreeApp/templates/radialTidyTreeApp/radial_tidy_tree_partial.html -->
{% load static %}
{% comment %}
  Vue owns all tree rendering via applyTreeData / paintTreeVisualization.
  Do not auto-paint D3 here (avoids SSR flash when fetchAccountLineage updates).
{% endcomment %}

<style>
    #radial-tree-container {
        position: relative;
        width: 100%;
        height: min(70vh, 640px);
        min-height: 360px;
        touch-action: none;
        overflow: hidden;
    }
    #radial-tree-container .sm-tree-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9ca3af;
        font-size: 0.95rem;
        pointer-events: none;
        z-index: 0;
    }
    #radial-tree-container svg#tree {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
    }

    /* Breadcrumbs: top-left of the visual (HTML overlay, not tiny SVG text) */
    .sm-tree-breadcrumbs {
        position: absolute;
        top: 10px;
        left: 10px;
        right: auto;
        max-width: min(72%, calc(100% - 300px));
        z-index: 6;
        display: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border-radius: 12px;
        background: rgba(16, 13, 35, 0.92);
        border: 1px solid #96DDF2;
        box-shadow: 0 0 16px rgba(150, 221, 242, 0.25);
        pointer-events: auto;
    }
    .sm-tree-breadcrumbs.is-visible { display: flex; }
    .sm-tree-breadcrumbs__chip {
        display: inline-flex;
        align-items: center;
        max-width: 100%;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 700;
        line-height: 1.2;
        color: #fff;
        background: #3f2c70;
        border: 1px solid #96DDF2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .sm-tree-breadcrumbs__chip--asset {
        background: #fcec04;
        color: #111;
        border-color: #fcec04;
    }
    .sm-tree-breadcrumbs__chip--active {
        box-shadow: 0 0 10px rgba(11, 231, 132, 0.55);
        border-color: #0BE784;
    }
    .sm-tree-breadcrumbs__sep {
        color: #0BE784;
        font-weight: 800;
        font-size: 1rem;
        opacity: 0.9;
        user-select: none;
    }

    /*
     * Properties popup — same look as the original node tooltip:
     * purple card for issuers, yellow for assets; bold labels + line breaks.
     */
    .sm-tree-props {
        position: absolute;
        top: 12px;
        right: 12px;
        bottom: auto;
        width: min(260px, calc(100% - 24px));
        max-height: min(70%, 360px);
        z-index: 6;
        display: none;
        flex-direction: column;
        gap: 0;
        padding: 0;
        border-radius: 6px;
        border: none;
        background: rgba(63, 44, 112, 0.94);
        color: #fff;
        box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.25);
        overflow: hidden;
        pointer-events: auto;
        font: 12px sans-serif;
    }
    .sm-tree-props.is-visible { display: flex; }
    .sm-tree-props--asset {
        background: rgba(252, 236, 4, 0.94);
        color: #111;
        box-shadow: 3px 3px 12px rgba(0, 0, 0, 0.28);
    }
    .sm-tree-props--issuer {
        background: rgba(63, 44, 112, 0.94);
        color: #fff;
    }
    .sm-tree-props__header {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;
        padding: 4px 4px 0;
        min-height: 0;
    }
    .sm-tree-props__title {
        display: none; /* original popup had no title bar */
    }
    .sm-tree-props__close {
        min-width: 28px;
        min-height: 28px;
        padding: 0;
        border-radius: 4px;
        border: none;
        background: transparent;
        color: inherit;
        opacity: 0.75;
        font-size: 1.15rem;
        line-height: 1;
        cursor: pointer;
        touch-action: manipulation;
    }
    .sm-tree-props__close:hover {
        opacity: 1;
        background: rgba(0, 0, 0, 0.12);
    }
    .sm-tree-props--issuer .sm-tree-props__close:hover {
        background: rgba(255, 255, 255, 0.12);
    }
    #sm-tree-props-body,
    .sm-tree-props__body {
        padding: 4px 12px 12px;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        line-height: 1.55;
        word-wrap: break-word;
        font: 12px sans-serif;
    }
    /* Original tooltip markup: <b>Label:</b> value<br> */
    .sm-tree-props__body b,
    #sm-tree-props-body b {
        font-weight: 700;
    }
    .sm-tree-props__line {
        display: block;
        margin: 0 0 2px;
        word-break: break-word;
    }

    @media (max-width: 1024px) {
        #radial-tree-container {
            height: min(62dvh, 560px);
            min-height: 300px;
        }
        .sm-tree-breadcrumbs {
            max-width: calc(100% - 20px);
            font-size: 0.9rem;
        }
        .sm-tree-breadcrumbs__chip {
            font-size: 0.8rem;
            padding: 7px 10px;
            min-height: 36px;
        }
        .sm-tree-props {
            top: auto;
            bottom: 12px;
            right: 12px;
            left: auto;
            width: min(280px, calc(100% - 24px));
            max-height: min(38%, 220px);
        }
    }
</style>

<div id="radial-tree-container">
    <div class="sm-tree-placeholder" id="sm-tree-placeholder">Loading lineage tree…</div>
    <nav id="sm-tree-breadcrumbs" class="sm-tree-breadcrumbs" aria-label="Node path" hidden></nav>
    <aside id="sm-tree-props" class="sm-tree-props sm-tree-props--issuer" aria-label="Node properties" hidden>
        <div class="sm-tree-props__header">
            <h3 class="sm-tree-props__title">Properties</h3>
            <button type="button" class="sm-tree-props__close" id="sm-tree-props-close" aria-label="Close properties">×</button>
        </div>
        <div id="sm-tree-props-body" class="sm-tree-props__body"></div>
    </aside>
    <svg id="tree" width="800" height="800" aria-label="Account lineage tree"></svg>
</div>
