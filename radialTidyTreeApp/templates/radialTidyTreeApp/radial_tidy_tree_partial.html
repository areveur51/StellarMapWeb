<!-- radialTidyTreeApp/templates/radialTidyTreeApp/radial_tidy_tree_partial.html -->
{% load static %}

<style>
    #radial-tree-container {
        position: relative;
        width: 100%;
        height: 800px;
        min-height: 60vh;
    }
    #radial-tree-container .sm-tree-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9ca3af;
        font-size: 0.95rem;
        pointer-events: none;
        z-index: 0;
    }
    #radial-tree-container svg#tree {
        position: relative;
        z-index: 1;
    }
</style>

{# Vue owns all tree rendering via applyTreeData — no early D3 paint here
   (avoids SSR flash then wipe when fetchAccountLineage updates the tree). #}
<div id="radial-tree-container">
    <div class="sm-tree-placeholder" id="sm-tree-placeholder">Loading lineage tree…</div>
    <svg id="tree" width="800" height="800"></svg>
</div>
